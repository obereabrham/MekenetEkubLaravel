name: mekenet_mobile
description: Mekenet Ekub member app for Android and iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_mlkit_face_detection: ^0.15.1
  http: ^1.6.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mekenet-ekub-logo.png

